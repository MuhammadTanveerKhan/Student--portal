<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>student-portal</title>
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-page">
        <img src="logo.png" alt="" class="logo">
        <span class="heading">
            <h1>Student Dashboard</h1>
            <p>login to continue</p>
        </span>
    
        <form action="dashboard.html" class="login-form">
            <label for="email">
                <b>Email</b>
            </label>
            <br>
            <input type="email" id="email" required  placeholder="&#9993; Enter your Email">
            <br>
            <label for="password">
                <b>password</b>
            </label>
            <br>
            <input type="password" id="password" required placeholder=" &#128274;&#65038;Enter your password">

            <span class="forgetpassword">
                <a href="#">Forget password?</a>
            </span>
            <button class="login-btn">Login</button>
            <span class="newaccount">
        </form>
            <p>
                Don't have an account? <a href="student.html">sign up</a>
            </p>
        </span>
    </div>
    <script src="index.js"></script>
</body>
</html>
